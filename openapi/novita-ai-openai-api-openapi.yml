openapi: 3.2.0
info:
  title: Novita Openai API
  version: 1.0.0
  description: Discovery document for Novita's OpenAI-compatible model APIs and platform APIs.
servers:
- url: https://api.novita.ai
  description: Novita API
tags:
- name: Openai
paths:
  /openai/v1/models:
    get:
      summary: List models
      description: List available OpenAI-compatible models.
      responses:
        '200':
          description: Model list
      tags:
      - Openai
      operationId: getOpenaiV1Models
      x-operation-id-source: derived
  /openai/v1/chat/completions:
    post:
      summary: Create chat completion
      description: Create an OpenAI-compatible chat completion.
      responses:
        '200':
          description: Chat completion response
      tags:
      - Openai
      operationId: postOpenaiV1ChatCompletions
      x-operation-id-source: derived
  /openai/v1/completions:
    post:
      summary: Create completion
      description: Create an OpenAI-compatible text completion.
      responses:
        '200':
          description: Completion response
      tags:
      - Openai
      operationId: postOpenaiV1Completions
      x-operation-id-source: derived
  /openai/v1/embeddings:
    post:
      summary: Create embeddings
      description: Create OpenAI-compatible embeddings.
      responses:
        '200':
          description: Embedding response
      tags:
      - Openai
      operationId: postOpenaiV1Embeddings
      x-operation-id-source: derived
